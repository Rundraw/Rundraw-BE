name: CI/CD Pipeline (.jar)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: main 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle 빌드
        run: ./gradlew clean build -x test

      - name: jar 업로드
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: build/libs/*.jar


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: jar 다운로드
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: build/libs


      - name: EC2 배포
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          ENV: ${{ secrets.ENV }}

        run: |

          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem


          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*plain.jar" | head -n 1)


          # jar 전송
          scp \
          -i private_key.pem \
          -o StrictHostKeyChecking=no \
          "$JAR_FILE" \
          $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/BackEnd.jar



          # 환경변수 + 재시작
          ssh \
          -i private_key.pem \
          -o StrictHostKeyChecking=no \
          $EC2_USERNAME@$EC2_HOST << EOF


          echo "$ENV" > /home/$EC2_USERNAME/.env


          # 기존 Spring Boot 종료
          PID=\$(pgrep -f BackEnd.jar)

          if [ ! -z "\$PID" ]; then
              kill -15 \$PID
              sleep 10
          fi


          # 새 버전 실행
          nohup java \
          -jar /home/$EC2_USERNAME/BackEnd.jar \
          > /home/$EC2_USERNAME/app.log 2>&1 &


          EOF


          rm -f private_key.pem
