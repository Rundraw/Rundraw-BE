name: CI/CD Pipeline (.jar)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4
      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
      - name: Spring Boot 빌드
        run: ./gradlew build -x test
      - name: jar 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: BackEnd
          path: build/libs/*.jar
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: jar 아티팩트 다운로드
        uses: actions/download-artifact@v4
        with:
          name: BackEnd
          path: build/libs/

      - name: Debian 서버 배포
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          ENV: ${{ secrets.ENV }}
        run: |
          # SSH private key 생성
          echo "$SERVER_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          # jar 파일 찾기
          jar_file=$(find build/libs -name '*.jar' ! -name '*plain.jar' | head -n 1)

          # 서버로 jar 전송
          scp \
          -i private_key.pem \
          -o StrictHostKeyChecking=no \
          "$jar_file" \
          $SERVER_USERNAME@$SERVER_HOST:/home/$SERVER_USERNAME/BackEnd.jar

          # 서버 접속 후 배포
          ssh \
          -i private_key.pem \
          -o StrictHostKeyChecking=no \
          $SERVER_USERNAME@$SERVER_HOST << EOF
          
          # 환경 변수 저장
          echo "$ENV" > /home/$SERVER_USERNAME/.env

          # 기존 Spring Boot 종료
          pgrep -f BackEnd.jar | xargs -r kill -15

          # 종료 대기
          sleep 10

          # 환경 변수 적용 후 실행
          export \$(cat /home/$SERVER_USERNAME/.env | xargs)

          nohup java \
          -jar /home/$SERVER_USERNAME/BackEnd.jar \
          > /home/$SERVER_USERNAME/app.log 2>&1 &

          EOF

          # SSH 키 제거
          rm -f private_key.pem